id = "restclient"
name = "REST Client"
description = "HTTP client for testing REST APIs with .http files"
version = "0.3.0"
schema_version = 1
authors = ["Tong Zhou"]
repository = "https://github.com/zed-ext/restclient"
languages = ["languages/http"]
capabilities = []

[lib]
kind = "Rust"
version = "0.7.0"

# Fork of rest-nvim/tree-sitter-http that adds the GRPC method
[grammars.http]
repository = "https://github.com/zed-ext/tree-sitter-http"
rev = "3e77a12324e24170dd46b3e3bc1fe79c33fcea10"

[language_servers.http-lsp]
name = "HTTP LSP"
language = "HTTP"

[language_servers.http-lsp.language_ids]
HTTP = "http"

